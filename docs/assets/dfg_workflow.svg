<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <style>
    .box { fill:#f7faff; stroke:#3b82f6; stroke-width:1.5; rx:8; }
    .title { font: 700 16px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; fill:#0f172a; }
    .text { font: 13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; fill:#334155; }
    .arrow { stroke:#64748b; stroke-width:1.5; marker-end:url(#arrow); fill:none; }
    .label { font: 12px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; fill:#475569; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <text x="20" y="30" class="title">系统总体架构（Verilog → DFG → 分析 → 报告/可视化 → 批处理）</text>

  <!-- Blocks -->
  <g transform="translate(40,60)">
    <rect class="box" x="0" y="0" width="180" height="80"/>
    <text x="16" y="32" class="text">Verilog 源代码</text>
    <text x="16" y="56" class="label">.v (UTF-8)</text>
  </g>

  <g transform="translate(260,60)">
    <rect class="box" x="0" y="0" width="220" height="80"/>
    <text x="16" y="28" class="text">Pyverilog 数据流分析</text>
    <text x="16" y="52" class="label">example_dataflow_simplify.py</text>
  </g>

  <g transform="translate(520,60)">
    <rect class="box" x="0" y="0" width="180" height="80"/>
    <text x="16" y="32" class="text">DFG 文本（Bind 级）</text>
    <text x="16" y="56" class="label">dfg_files/*.txt</text>
  </g>

  <g transform="translate(740,60)">
    <rect class="box" x="0" y="0" width="180" height="80"/>
    <text x="16" y="28" class="text">线性分析 CLI</text>
    <text x="16" y="52" class="label">esimulator_cli.py analyze</text>
  </g>

  <g transform="translate(520,180)">
    <rect class="box" x="0" y="0" width="180" height="80"/>
    <text x="16" y="28" class="text">报告与掩码</text>
    <text x="16" y="52" class="label">*linearity_graph.json / *bind_masks.json</text>
  </g>

  <g transform="translate(740,180)">
    <rect class="box" x="0" y="0" width="180" height="80"/>
    <text x="16" y="28" class="text">可视化</text>
    <text x="16" y="52" class="label">viz/*.dot, viz/*.html, (png)</text>
  </g>

  <g transform="translate(260,180)">
    <rect class="box" x="0" y="0" width="220" height="80"/>
    <text x="16" y="28" class="text">DFG 解析 &amp; 报告生成</text>
    <text x="16" y="52" class="label">esimulator/core/*</text>
  </g>

  <g transform="translate(40,300)">
    <rect class="box" x="0" y="0" width="320" height="80"/>
    <text x="16" y="28" class="text">自动化批处理</text>
    <text x="16" y="52" class="label">tools/auto_process_4004_modules.py</text>
  </g>

  <g transform="translate(400,300)">
    <rect class="box" x="0" y="0" width="520" height="80"/>
    <text x="16" y="28" class="text">结果目录</text>
    <text x="16" y="52" class="label">results/&lt;module&gt;_result/*, overall_summary.json</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M 220 100 L 260 100" />
  <path class="arrow" d="M 480 100 L 520 100" />
  <path class="arrow" d="M 700 100 L 740 100" />

  <path class="arrow" d="M 610 140 L 610 180" />
  <path class="arrow" d="M 830 140 L 830 180" />
  <path class="arrow" d="M 520 220 L 480 220 L 480 220 L 480 220" />
  <path class="arrow" d="M 260 220 L 220 220 L 220 140 L 260 140" />

  <path class="arrow" d="M 200 340 L 400 340" />
</svg>
